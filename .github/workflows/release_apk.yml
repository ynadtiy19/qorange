name: Build & Release per Branch

on:
  push:
    branches:
      - main
      - 'arena/**'                  # 匹配所有 arena/ 开头的分支
  workflow_dispatch:                # 支持在 Actions 界面手动运行

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出触发当前工作流的分支代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 清理本地代理配置，并将 8G 内存调整为适合云端 7G Runner 的 3.5G
      - name: Sanitize gradle.properties
        run: |
          if [ -f "android/gradle.properties" ]; then
            sed -i '/systemProp\.http/d' android/gradle.properties
            sed -i '/systemProp\.https/d' android/gradle.properties
            sed -i 's/-Xmx[0-9]*[gG]/-Xmx3584m/g' android/gradle.properties
            sed -i 's/-XX:MaxMetaspaceSize=[0-9]*[gG]/-XX:MaxMetaspaceSize=512m/g' android/gradle.properties
          fi

      # 3. 设置 JDK 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 设置 Flutter 环境并开启 SDK 缓存
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 5. Gradle 缓存
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 6. 还原签名密钥
      - name: Restore Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/qorange.jks
          ls -l android/app/qorange.jks
          keytool -list -keystore android/app/qorange.jks \
            -storepass "${KEYSTORE_PASSWORD:-626262}" >/dev/null \
            && echo "✅ keystore 校验通过" \
            || { echo "❌ keystore 无效：请检查 KEYSTORE_BASE64 是否完整"; exit 1; }

      # 7. 获取依赖
      - name: Install Dependencies
        run: flutter pub get

      # 8. 使用 --split-per-abi 分包构建（极大减小体积，从 77M 降到 20~30M）
      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi

      # 9. 格式化重命名各个架构的 APK
      - name: Prepare APKs
        id: meta
        run: |
          RAW_BRANCH="${GITHUB_REF_NAME}"
          SAFE_BRANCH=$(echo "${RAW_BRANCH}" | sed 's/\//_/g')
          
          OUTPUT_DIR="build/app/outputs/flutter-apk"
          
          # 重命名三种架构的分包
          if [ -f "$OUTPUT_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$OUTPUT_DIR/app-arm64-v8a-release.apk" "$OUTPUT_DIR/qorange-${SAFE_BRANCH}-arm64-v8a.apk"
          fi
          if [ -f "$OUTPUT_DIR/app-armeabi-v7a-release.apk" ]; then
            cp "$OUTPUT_DIR/app-armeabi-v7a-release.apk" "$OUTPUT_DIR/qorange-${SAFE_BRANCH}-armeabi-v7a.apk"
          fi
          if [ -f "$OUTPUT_DIR/app-x86_64-release.apk" ]; then
            cp "$OUTPUT_DIR/app-x86_64-release.apk" "$OUTPUT_DIR/qorange-${SAFE_BRANCH}-x86_64.apk"
          fi

          echo "safe_branch=${SAFE_BRANCH}" >> $GITHUB_OUTPUT

      # 10. 上传 Artifacts 备份
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qorange-${{ steps.meta.outputs.safe_branch }}-apks
          path: build/app/outputs/flutter-apk/qorange-${{ steps.meta.outputs.safe_branch }}-*.apk

      # 11. 发布/覆盖更新到 GitHub Releases
      - name: Create or Update Branch Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ steps.meta.outputs.safe_branch }}
          name: "Release [${{ github.ref_name }}]"
          body: |
            ### 构建信息
            - **分支**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`
            - **构建时间**: ${{ github.event.head_commit.timestamp || 'Manual Trigger' }}
            
            ### 架构下载建议：
            - **arm64-v8a**: 推荐！几乎所有现代 Android 手机（体积最小，性能最好）
            - **armeabi-v7a**: 适用于极老旧的 32 位 Android 手机
            - **x86_64**: 适用于电脑 Android 模拟器
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          overwrite: true # 关键：强制覆盖已存在的同名旧包
          files: |
            build/app/outputs/flutter-apk/qorange-${{ steps.meta.outputs.safe_branch }}-*.apk
