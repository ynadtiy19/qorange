name: Build & Release per Branch

on:
  push:
    branches:
      - main
      - 'arena/**'                  # 匹配所有 arena/ 开头的分支（包含 01a004f0-qorange）
  workflow_dispatch:                # 支持在 Actions 界面选择任意分支手动运行

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出触发当前工作流的分支代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 清理本地代理配置，并将 8G 内存调整为适合云端 7G Runner 的 3.5G
      - name: Sanitize gradle.properties
        run: |
          if [ -f "android/gradle.properties" ]; then
            sed -i '/systemProp\.http/d' android/gradle.properties
            sed -i '/systemProp\.https/d' android/gradle.properties
            sed -i 's/-Xmx[0-9]*[gG]/-Xmx3584m/g' android/gradle.properties
            sed -i 's/-XX:MaxMetaspaceSize=[0-9]*[gG]/-XX:MaxMetaspaceSize=512m/g' android/gradle.properties
          fi

      # 3. 设置 JDK 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 设置 Flutter 环境并开启 SDK 缓存
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 5. Gradle 缓存
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      # 6. 获取依赖
      - name: Install Dependencies
        run: flutter pub get

      # 7. 打包 Release APK
      - name: Build APK
        run: flutter build apk --release

      # 8. 格式化分支名称并重命名 APK（斜杠 / 转为 _ 防止路径错误）
      - name: Prepare APK and Release metadata
        id: meta
        run: |
          RAW_BRANCH="${GITHUB_REF_NAME}"
          # 将分支名中的 "/" 替换为 "_"，例如 arena/01a004f0-qorange -> arena_01a004f0-qorange
          SAFE_BRANCH=$(echo "${RAW_BRANCH}" | sed 's/\//_/g')
          
          APK_NAME="qorange-${SAFE_BRANCH}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APK_NAME}"
          
          # 输出变量供后续步骤使用
          echo "safe_branch=${SAFE_BRANCH}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT

      # 9. 上传到当前分支的 Actions Artifacts
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qorange-${{ steps.meta.outputs.safe_branch }}
          path: build/app/outputs/flutter-apk/${{ steps.meta.outputs.apk_name }}

      # 10. 发布到 GitHub Releases（不同分支独立 Release）
      - name: Create or Update Branch Release
        uses: softprops/action-gh-release@v2
        with:
          # Tag 命名：每个分支对应独立的 Tag（如 release-main、release-arena_01a004f0-qorange）
          tag_name: release-${{ steps.meta.outputs.safe_branch }}
          target_commitish: ${{ github.sha }}
          name: "Release [${{ github.ref_name }}]"
          body: |
            ### 构建信息
            - **分支**: `${{ github.ref_name }}`
            - **Commit**: `${{ github.sha }}`
            - **构建时间**: ${{ github.event.head_commit.timestamp || 'Manual Trigger' }}
          prerelease: ${{ github.ref_name != 'main' }} # 非 main 分支自动标记为 Pre-release
          make_latest: ${{ github.ref_name == 'main' }} # 只有 main 分支才作为正式 Latest
          files: |
            build/app/outputs/flutter-apk/${{ steps.meta.outputs.apk_name }}
