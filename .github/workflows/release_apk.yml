name: Build & Release per Branch

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码（完整拉取 Git 历史以准确读取 Commit Log）
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 深度优化 gradle.properties：清理代理 + 调整内存 + 开启并行与构建缓存
      - name: Optimize gradle.properties
        run: |
          if [ -f "android/gradle.properties" ]; then
            sed -i '/systemProp\.http/d' android/gradle.properties
            sed -i '/systemProp\.https/d' android/gradle.properties
            sed -i 's/-Xmx[0-9]*[gG]/-Xmx3584m/g' android/gradle.properties
            sed -i 's/-XX:MaxMetaspaceSize=[0-9]*[gG]/-XX:MaxMetaspaceSize=512m/g' android/gradle.properties
            echo "org.gradle.caching=true" >> android/gradle.properties
            echo "org.gradle.parallel=true" >> android/gradle.properties
          fi

      # 3. 设置 JDK 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. 设置 Flutter 环境并自动缓存 SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      # 5. 自动管理并持久化 Gradle 依赖与构建缓存
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 6. 设置 C/C++ 编译缓存
      - name: Setup ccache for C/C++ Native Code
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.ref_name }}
          max-size: 500M

      # 7. 还原签名密钥
      - name: Restore Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/qorange.jks
          ls -l android/app/qorange.jks
          keytool -list -keystore android/app/qorange.jks \
            -storepass "${KEYSTORE_PASSWORD:-626262}" >/dev/null \
            && echo "✅ keystore 校验通过" \
            || { echo "❌ keystore 无效：请检查 KEYSTORE_BASE64 是否完整"; exit 1; }

      # 8. 获取依赖
      - name: Install Dependencies
        run: flutter pub get

      # 9. 构建正式版分包 APK (开启混淆与符号表剥离)
      - name: Build Split APKs
        run: |
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols

      # 10. 准备与重命名产物
      - name: Prepare APKs
        id: meta
        run: |
          RAW_BRANCH="${GITHUB_REF_NAME}"
          SAFE_BRANCH=$(echo "${RAW_BRANCH}" | sed 's/\//_/g')
          OUTPUT_DIR="build/app/outputs/flutter-apk"
          
          if [ -f "$OUTPUT_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$OUTPUT_DIR/app-arm64-v8a-release.apk" "$OUTPUT_DIR/qorange-${SAFE_BRANCH}-arm64-v8a.apk"
          fi
          if [ -f "$OUTPUT_DIR/app-armeabi-v7a-release.apk" ]; then
            cp "$OUTPUT_DIR/app-armeabi-v7a-release.apk" "$OUTPUT_DIR/qorange-${SAFE_BRANCH}-armeabi-v7a.apk"
          fi
          if [ -f "$OUTPUT_DIR/app-x86_64-release.apk" ]; then
            cp "$OUTPUT_DIR/app-x86_64-release.apk" "$OUTPUT_DIR/qorange-${SAFE_BRANCH}-x86_64.apk"
          fi

          echo "safe_branch=${SAFE_BRANCH}" >> $GITHUB_OUTPUT

      # 11. 上传 Artifacts 备份
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qorange-${{ steps.meta.outputs.safe_branch }}-apks
          path: build/app/outputs/flutter-apk/qorange-${{ steps.meta.outputs.safe_branch }}-*.apk

      # 12. 🌟 核心升级：改用 GitHub 官方原生 CLI (gh) 发布，彻底消灭 503 与分支解析错误
      - name: Publish Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SAFE_BRANCH="${{ steps.meta.outputs.safe_branch }}"
          TAG_NAME="release-${SAFE_BRANCH}"
          TITLE="Release [${{ github.ref_name }}]"
          
          BODY="### 构建信息
          - **分支**: \`${{ github.ref_name }}\`
          - **Commit**: \`${{ github.sha }}\`
          - **构建时间**: $(date '+%Y-%m-%d %H:%M:%S')
          
          ### 架构下载建议：
          - **arm64-v8a**: 推荐大多数现代安卓手机下载（体积最小）
          - **armeabi-v7a**: 适用于老旧 32 位手机
          - **x86_64**: 适用于电脑模拟器"

          echo "Publishing release for tag: $TAG_NAME ..."

          # 检查 Release 是否已存在，存在则更新，不存在则新建
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME exists. Updating release info and assets..."
            gh release edit "$TAG_NAME" --title "$TITLE" --notes "$BODY" --target "${{ github.sha }}"
            gh release upload "$TAG_NAME" build/app/outputs/flutter-apk/qorange-${SAFE_BRANCH}-*.apk --clobber
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" build/app/outputs/flutter-apk/qorange-${SAFE_BRANCH}-*.apk \
              --title "$TITLE" \
              --notes "$BODY" \
              --target "${{ github.sha }}" \
              --clobber \
              --prerelease
          fi

      # 13. 打包发布成功后，自动从 pubspec.yaml 提取版本号写入 MongoDB
      - name: Sync Release to MongoDB
        run: |
          SAFE_BRANCH="${{ steps.meta.outputs.safe_branch }}"
          APK_URL="https://github.com/ynadtiy19/qorange/releases/download/release-${SAFE_BRANCH}/qorange-${SAFE_BRANCH}-arm64-v8a.apk"
          
          # 自动从 pubspec.yaml 提取版本名称 (如 1.9.0) 与构建号 (如 2)
          APP_VERSION=$(grep 'version:' pubspec.yaml | head -n1 | cut -d ' ' -f2 | cut -d '+' -f1)
          BUILD_NUMBER=$(grep 'version:' pubspec.yaml | head -n1 | cut -d '+' -f2)
          if [ -z "$BUILD_NUMBER" ]; then
            BUILD_NUMBER="${{ github.run_number }}"
          fi

          # 自动提取最后一次提交的 commit 说明
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ' | sed 's/"/\\"/g')
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="升级至 v${APP_VERSION}，优化系统稳定性"
          fi
          
          # 将包含 version 与 build_number 的完整数据同步至后端
          curl -s -X POST "https://googlechat.zeabur.app/api/publish-release" \
            -H "Content-Type: application/json" \
            -d "{
              \"secret\": \"qorange_ci_secret_2026\",
              \"branch\": \"${{ github.ref_name }}\",
              \"commit_sha\": \"${{ github.sha }}\",
              \"tag_name\": \"v${APP_VERSION}\",
              \"version\": \"${APP_VERSION}\",
              \"build_number\": ${BUILD_NUMBER},
              \"changelog\": \"$COMMIT_MSG\",
              \"download_url\": \"${APK_URL}\",
              \"arch\": \"arm64-v8a\"
            }"